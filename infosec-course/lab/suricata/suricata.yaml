%YAML 1.1
---
default-rule-path: /var/lib/suricata/rules
rule-files:
  - local.rules

vars:
  address-groups:
    HOME_NET: "[172.28.0.0/16,192.168.0.0/16,10.0.0.0/8]"
    EXTERNAL_NET: "!$HOME_NET"

outputs:
  - fast:
      enabled: yes
      filename: fast.log
      append: yes
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            metadata: yes
            http-body: yes
        - http:
            extended: yes
        - dns:
            version: 2
        - tls:
            extended: yes

app-layer:
  protocols:
    http:
      enabled: yes
    tls:
      enabled: yes
    dns:
      global-memcap: 16mb
